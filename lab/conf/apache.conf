# Single prefork worker, no keep-alive: producer and consumer must be handled
# by the same process. The replacement worker is forked from the prefork
# parent, so its address-space layout is deterministic across stages.
KeepAlive Off

<IfModule mpm_prefork_module>
    StartServers           1
    MinSpareServers        1
    MaxSpareServers        1
    MaxRequestWorkers      1
    ServerLimit            1
    MaxConnectionsPerChild 0
</IfModule>
