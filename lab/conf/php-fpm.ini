; FPM-specific lab config for the CVE-2026-109619 Chain E reproduction.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; 32M so a ~30MB session file OOMs during php_var_unserialize (post-startup).
memory_limit = 32M
post_max_size = 128M
upload_max_filesize = 128M
max_input_vars = 1000

session.save_handler = files
session.save_path = "/tmp/sessions"
session.use_strict_mode = 0
session.use_cookies = 1
session.use_only_cookies = 0
session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.prefix = upload_progress_
session.upload_progress.name = PHP_SESSION_UPLOAD_PROGRESS
session.upload_progress.freq = 1%
session.upload_progress.min_freq = 0

; Make the gadget class available before the request script is compiled.
opcache.enable = 1
opcache.preload = /var/www/html/preload.php
opcache.preload_user = www-data
