; Lab config for CVE-2026-109618 / CVE-2026-109619
; Matches the conditions of the published exploit chain.
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Low enough that the producer request OOMs during pre-RINIT upload-progress
; session initialization.
memory_limit = 8M
post_max_size = 64M
upload_max_filesize = 64M
max_input_vars = 1000

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
